name: Bug report
description: Something in Assumer behaves differently than it should
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected, and what you got instead. Paste any error message or stack trace here.
      placeholder: |
        I ran `assumer run "..."` and it exited immediately with:

        ```
        ...
        ```
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Run `assumer --version`.
      placeholder: "1.18.16"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Terminal app
        - Command line
        - Desktop app
        - Browser
        - Not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15.2, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Only if you are reporting a terminal or command line problem.
      placeholder: "Windows Terminal, iTerm2, Ghostty"

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: If it happens every time, the steps. If it happened once, what you were doing when it did.
